site_name: tmmcore
site_description: Transfer-matrix method for multilayer thin-film optics, with exact analytic derivatives
site_url: https://aai2k.github.io/tmmcore/
repo_url: https://github.com/aai2k/tmmcore
repo_name: aai2k/tmmcore
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# Order matters. The hook calls renderMathInElement, which auto-render defines,
# and document$ emits as soon as it is subscribed to, so the library must load
# first. (Material's MathJax example puts the hook first because MathJax reads a
# config object at load time; KaTeX is the opposite case.)
extra_javascript:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js
  - js/katex.js

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css

# The Python examples live with the package, in python/examples. mkdocs-jupyter
# mounts that folder, runs each script as a notebook on every build and
# renders it with its output, so a page cannot show output the current code
# does not produce, and a failing check fails the build. No cache: an example
# reruns even when only tmmcore changed.
plugins:
  - search
  - mkdocs-jupyter:
      notebook_dirs:
        python-examples: python/examples
      include: ["*.py"]
      execute: true
      allow_errors: false
      cache: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference: api.md
  - Python: python.md
  - Python examples:
      - python-examples/01_quarter_wave.py
      - python-examples/02_ar_spectrum.py
      - python-examples/03_v_coat.py
      - python-examples/04_bbar_optimize.py
      - python-examples/05_silver_mirror.py
      - python-examples/06_tilted_filter.py
      - python-examples/07_monitoring.py
      - python-examples/08_thickness_errors.py
  - JavaScript examples: examples.md
  - Validation: validation.md
  - Comparison with other packages: comparison.md
