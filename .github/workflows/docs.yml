name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Figures are generated by the examples, never hand-drawn. Regenerating
      # them here and failing on a diff keeps the documentation honest: an image
      # can never show behaviour the current code does not produce.
      - name: Regenerate figures
        run: |
          for f in examples/[0-9]*.mjs; do node "$f"; done
          git diff --exit-code --stat -- docs/img \
            || { echo "::error::Figures in docs/img are stale. Run the examples and commit the result."; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
