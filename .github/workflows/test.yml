name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: JavaScript against WebAssembly
        run: npm test

      - name: Against an independent implementation
        run: npm run compare

      - name: Examples
        run: npm run examples

  native-c:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The kernel claims to be portable C99 needing nothing but libm. Compile
      # each source, and tmm_kernel.c that includes them all, warning-free with
      # whatever the platform provides (gcc on Linux, clang on macOS, MSVC on
      # Windows), so the claim is tested rather than asserted.
      - name: Compile (gcc / clang)
        if: runner.os != 'Windows'
        run: cc -std=c99 -pedantic -Wall -Wextra -Werror -O2 -c src/c/*.c

      - name: Compile (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) { throw 'MSVC installation not found' }

          Import-Module (Join-Path $installPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          cl /c /W3 /WX /O2 src\c\*.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The javascript job tests src/wasm/tmm_kernel.wasm as committed, and the
  # module is built by hand. Build it again from src/c and fail when it differs
  # from the committed file by a byte, so a change to the C committed without a
  # rebuild fails here. Built on Windows, as the committed module is, since the
  # comparison is byte for byte.
  wasm:
    runs-on: windows-latest
    env:
      # The Emscripten release the committed module is built with, and the
      # emsdk tag that installs it. Another version can write other bytes from
      # the same C, so rebuilding the module with another version means
      # changing this pin in the same commit.
      EMSCRIPTEN_VERSION: '5.0.7'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Emscripten
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:EMSCRIPTEN_VERSION https://github.com/emscripten-core/emsdk.git "$env:RUNNER_TEMP\emsdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\emsdk\emsdk.ps1" install $env:EMSCRIPTEN_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\emsdk\emsdk.ps1" activate $env:EMSCRIPTEN_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build from src/c
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\emsdk\emsdk_env.ps1"
          npm run build:wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The committed module is the one src/c builds
        shell: pwsh
        run: |
          git diff --exit-code --stat -- src/wasm/tmm_kernel.wasm
          if ($LASTEXITCODE -ne 0) {
            echo "::error::src/wasm/tmm_kernel.wasm is not what src/c builds. Run npm run build:wasm under Emscripten $env:EMSCRIPTEN_VERSION and commit the result."
            exit 1
          }
